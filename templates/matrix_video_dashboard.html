<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矩阵号视频监控看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #1a1a2e; }

    .page-header { background: linear-gradient(135deg, #111827, #0f172a); color: #fff; padding: 24px 30px; }
    .page-header h1 { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
    .page-header .subtitle { font-size: 12.5px; color: rgba(255,255,255,0.65); margin-top: 6px; line-height: 1.6; }
    .page-header a { color: #8ec5ff; font-size: 13px; text-decoration: none; }
    .page-header a:hover { text-decoration: underline; }

    .container { max-width: 1440px; margin: 0 auto; padding: 22px 20px 52px; }
    .card { background: #fff; border-radius: 14px; padding: 20px 22px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 6px 16px rgba(15,23,42,.04); }
    .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #111827; display: flex; align-items: center; gap: 8px; }
    .card h2::before { content: ''; width: 4px; height: 15px; background: #2962FF; border-radius: 3px; display: inline-block; }

    label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 5px; font-weight: 500; }
    input, select { padding: 9px 11px; border: 1px solid #e2e5eb; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; transition: border-color .15s; }
    input:focus, select:focus { outline: none; border-color: #2962FF; box-shadow: 0 0 0 3px rgba(41,98,255,.1); }

    .btn { padding: 9px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: filter .12s, transform .05s; font-family: inherit; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: #2962FF; color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: #eef0f4; color: #374151; }
    .btn-secondary:hover { filter: brightness(0.97); }
    .btn:disabled { background: #cbd5e1; color: #fff; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 11.5px; border-radius: 7px; }
    .btn-ghost { background: transparent; border: 1px solid #d7dbe3; color: #374151; }
    .btn-ghost:hover { background: #f8fafc; }

    .status { margin-top: 12px; font-size: 12.5px; color: #6b7280; min-height: 18px; word-break: break-all; }
    .status.err { color: #dc2626; font-weight: 500; }

    /* ---- 筛选面板 ---- */
    .filter-section { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid #f1f2f5; flex-wrap: wrap; }
    .filter-section:last-of-type { border-bottom: none; }
    .filter-section-label { font-size: 12.5px; font-weight: 600; color: #374151; min-width: 52px; flex-shrink: 0; }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill-btn { padding: 6px 15px; border-radius: 999px; border: 1px solid #e2e5eb; background: #fff; font-size: 12.5px; cursor: pointer; color: #4b5563; font-weight: 500; transition: all .12s; font-family: inherit; }
    .pill-btn:hover { border-color: #2962FF; color: #2962FF; }
    .pill-btn.active { background: #111827; color: #fff; border-color: #111827; }
    .empty-hint { font-size: 12px; color: #9ca3af; align-self: center; }

    .search-controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; padding-top: 16px; }
    .form-group { flex: 1; min-width: 160px; }
    .form-group input { width: 100%; }
    .form-group.quick-range { flex: 0 0 auto; display: flex; gap: 8px; }
    .form-group.actions { flex: 0 0 auto; display: flex; gap: 10px; }

    /* ---- KPI 卡片 ---- */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .kpi-card { background: #fff; border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 6px 16px rgba(15,23,42,.04); display: flex; align-items: center; gap: 16px; }
    .kpi-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0; }
    .kpi-label { font-size: 12.5px; color: #6b7280; margin-bottom: 6px; font-weight: 500; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #111827; line-height: 1.1; }
    .kpi-blue .kpi-icon { background: #EAF1FF; } .kpi-blue .kpi-value { color: #2962FF; }
    .kpi-green .kpi-icon { background: #ECFDF5; } .kpi-green .kpi-value { color: #059669; }
    .kpi-purple .kpi-icon { background: #F5F3FF; } .kpi-purple .kpi-value { color: #7C3AED; }
    .kpi-orange .kpi-icon { background: #FFFBEB; } .kpi-orange .kpi-value { color: #D97706; }
    .kpi-pink .kpi-icon { background: #FDF2F8; } .kpi-pink .kpi-value { color: #DB2777; }

    /* ---- 表格 ---- */
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { border-bottom: 1px solid #f1f2f5; padding: 11px 12px; text-align: left; vertical-align: top; white-space: nowrap; }
    th { background: #f8fafc; color: #4b5563; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0; z-index: 1; }
    tbody tr:hover { background: #f8fafc; }
    .table-wrap { overflow: auto; max-height: 640px; border: 1px solid #eef0f3; border-radius: 12px; }
    .muted { color: #9ca3af; }
    .link { color: #2962FF; text-decoration: none; font-weight: 500; }
    .link:hover { text-decoration: underline; }

    .tag-input { border: 1px solid transparent; background: transparent; padding: 5px 7px; font-size: 12.5px; width: 120px; border-radius: 6px; font-family: inherit; }
    .tag-input:hover { border-color: #e2e5eb; background: #fff; }
    .tag-input:focus { border-color: #2962FF; background: #fff; outline: none; box-shadow: 0 0 0 3px rgba(41,98,255,.1); }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-region { background: #eef0f4; color: #374151; }
    .badge-kol { background: #F5F3FF; color: #7C3AED; }
    .badge-campaign { background: #FFFBEB; color: #B45309; }

    .hashtags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 200px; white-space: normal; }
    .hashtag-chip { background: #EAF1FF; color: #2962FF; font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 500; }

    .caption-cell { max-width: 240px; white-space: normal; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; cursor: default; }

    .spark-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #374151; background: #f1f2f5; padding: 2px 6px; border-radius: 5px; }

    .pagination { display: flex; gap: 12px; align-items: center; margin-top: 16px; font-size: 12.5px; color: #6b7280; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #d7dbe3; border-radius: 5px; }
  </style>
</head>
<body>
<div class="page-header">
  <h1>矩阵号视频监控看板</h1>
  <div class="subtitle">PUBG Mobile 矩阵号切片视频数据汇总，用于客户回报及优秀视频复刻激励。</div>
  <div style="margin-top:10px;"><a href="/">← 返回首页</a></div>
</div>

<div class="container">
  <div class="card">
    <h2>筛选</h2>
    <div class="filter-section">
      <span class="filter-section-label">国家</span>
      <div class="pill-row" id="region-pills"></div>
    </div>
    <div class="filter-section">
      <span class="filter-section-label">账号类型</span>
      <div class="pill-row" id="type-pills">
        <button class="pill-btn active" data-type="" onclick="setTypeFilter('', this)">全部</button>
        <button class="pill-btn" data-type="KOL" onclick="setTypeFilter('KOL', this)">KOL</button>
        <button class="pill-btn" data-type="Campaign" onclick="setTypeFilter('Campaign', this)">Campaign</button>
      </div>
    </div>
    <div class="search-controls">
      <div class="form-group">
        <label>开始日期</label>
        <input type="date" id="date-from" onchange="applyFilters()">
      </div>
      <div class="form-group">
        <label>结束日期</label>
        <input type="date" id="date-to" onchange="applyFilters()">
      </div>
      <div class="form-group quick-range">
        <button class="btn btn-ghost btn-sm" onclick="setQuickRange(7)">最近7天</button>
        <button class="btn btn-ghost btn-sm" onclick="setQuickRange(30)">最近30天</button>
        <button class="btn btn-ghost btn-sm" onclick="clearRange()">清除</button>
      </div>
      <div class="form-group">
        <label>创作者/账号</label>
        <input type="text" id="creator-input" placeholder="别名或账号ID" oninput="debouncedApply()">
      </div>
      <div class="form-group">
        <label>关键词/Tag</label>
        <input type="text" id="keyword-input" placeholder="标题、文案或 #tag" oninput="debouncedApply()">
      </div>
      <div class="form-group actions">
        <button class="btn btn-primary" onclick="applyFilters()">查询</button>
        <button class="btn btn-secondary" onclick="downloadExport()">📥 下载报表（前一日）</button>
      </div>
    </div>
    <div class="status" id="filter-status"></div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card kpi-blue"><div class="kpi-icon">📺</div><div><div class="kpi-label">全周期总播放</div><div class="kpi-value" id="kpi-views">-</div></div></div>
    <div class="kpi-card kpi-green"><div class="kpi-icon">💬</div><div><div class="kpi-label">全周期总互动量</div><div class="kpi-value" id="kpi-engagement">-</div></div></div>
    <div class="kpi-card kpi-purple"><div class="kpi-icon">📈</div><div><div class="kpi-label">整体互动率</div><div class="kpi-value" id="kpi-rate">-</div></div></div>
    <div class="kpi-card kpi-orange"><div class="kpi-icon">👥</div><div><div class="kpi-label">监控账号数</div><div class="kpi-value" id="kpi-accounts">-</div></div></div>
    <div class="kpi-card kpi-pink"><div class="kpi-icon">🎬</div><div><div class="kpi-label">总视频数</div><div class="kpi-value" id="kpi-videos">-</div></div></div>
  </div>

  <div class="card">
    <h2>视频明细</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>关联任务编号</th>
            <th>作品发布链接</th>
            <th>所属矩阵账号</th>
            <th>国家</th>
            <th>账号类型</th>
            <th>对应KOL/Campaign</th>
            <th>作品发布时间</th>
            <th>作品标题/文案</th>
            <th>话题标签</th>
            <th>Spark code</th>
            <th>账号ID</th>
            <th>视频ID</th>
            <th>播放量（最新）</th>
            <th>次日播放量</th>
            <th>互动率（最新）</th>
          </tr>
        </thead>
        <tbody id="videos-body"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="btn btn-ghost btn-sm" onclick="prevPage()">← 上一页</button>
      <span id="page-info">-</span>
      <button class="btn btn-ghost btn-sm" onclick="nextPage()">下一页 →</button>
    </div>
  </div>
</div>

<script>
let accounts = [];
let videos = [];
let filters = { region: '', account_type: '', date_from: '', date_to: '', creator: '', keyword: '' };
let limit = 50;
let offset = 0;
let total = 0;
let debounceTimer = null;

function fmt(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'number') return v.toLocaleString();
  return String(v);
}

function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function pct(v) {
  if (v === null || v === undefined || v === '') return '-';
  const n = Number(v);
  if (Number.isNaN(n)) return '-';
  return (n * 100).toFixed(2) + '%';
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.status === 'error') throw new Error(data.message || ('HTTP ' + res.status));
  return data;
}

function debouncedApply() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => applyFilters(), 400);
}

function setTypeFilter(type, btn) {
  filters.account_type = type;
  document.querySelectorAll('#type-pills .pill-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setRegionFilter(region, btn) {
  filters.region = region;
  document.querySelectorAll('#region-pills .pill-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setQuickRange(days) {
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - days);
  document.getElementById('date-from').value = from.toISOString().slice(0, 10);
  document.getElementById('date-to').value = to.toISOString().slice(0, 10);
  applyFilters();
}

function clearRange() {
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  applyFilters();
}

async function loadAccountsForRegions() {
  try {
    const data = await fetchJson('/api/tiktok-official/accounts');
    accounts = data.accounts || [];
    const regions = Array.from(new Set(accounts.map(a => a.region).filter(Boolean))).sort();
    const wrap = document.getElementById('region-pills');
    wrap.innerHTML = '<button class="pill-btn active" data-region="" onclick="setRegionFilter(\'\', this)">全部</button>'
      + regions.map(r => `<button class="pill-btn" data-region="${esc(r)}" onclick="setRegionFilter('${esc(r)}', this)">${esc(r)}</button>`).join('');
    if (!regions.length) {
      wrap.innerHTML += '<span class="empty-hint">尚未给账号设置国家，去 <a class="link" href="/tiktok-official" target="_blank">账号管理页</a> 设置</span>';
    }
  } catch (e) {
    // 账号列表加载失败不阻塞视频看板
  }
}

function applyFilters() {
  filters.date_from = document.getElementById('date-from').value || '';
  filters.date_to = document.getElementById('date-to').value || '';
  filters.creator = document.getElementById('creator-input').value.trim();
  filters.keyword = document.getElementById('keyword-input').value.trim();
  offset = 0;
  loadVideos();
}

function prevPage() {
  offset = Math.max(0, offset - limit);
  loadVideos();
}

function nextPage() {
  if (offset + limit >= total) return;
  offset += limit;
  loadVideos();
}

async function loadVideos() {
  const statusEl = document.getElementById('filter-status');
  statusEl.classList.remove('err');
  statusEl.textContent = '加载中...';
  try {
    const params = new URLSearchParams();
    Object.entries(filters).forEach(([k, v]) => { if (v) params.set(k, v); });
    params.set('limit', limit);
    params.set('offset', offset);
    const data = await fetchJson('/api/tiktok-official/matrix-videos?' + params.toString());
    videos = data.videos || [];
    total = data.total || 0;
    renderVideos();
    renderSummary(data.summary || {});
    statusEl.textContent = `共 ${fmt(total)} 条视频`;
  } catch (e) {
    statusEl.classList.add('err');
    statusEl.textContent = '加载失败：' + String(e.message || e);
  }
}

function renderSummary(summary) {
  document.getElementById('kpi-views').textContent = fmt(summary.total_views || 0);
  document.getElementById('kpi-engagement').textContent = fmt(summary.total_engagement || 0);
  document.getElementById('kpi-rate').textContent = pct(summary.overall_engagement_rate || 0);
  document.getElementById('kpi-accounts').textContent = fmt(summary.account_count || 0);
  document.getElementById('kpi-videos').textContent = fmt(summary.video_count || 0);
  document.getElementById('page-info').textContent = total
    ? `第 ${Math.floor(offset / limit) + 1} 页，共 ${Math.ceil(total / limit)} 页`
    : '无数据';
}

function accountTypeBadge(type) {
  if (!type) return '<span class="muted">-</span>';
  const cls = type === 'KOL' ? 'badge-kol' : 'badge-campaign';
  return `<span class="badge ${cls}">${esc(type)}</span>`;
}

function renderVideos() {
  const body = document.getElementById('videos-body');
  if (!videos.length) {
    body.innerHTML = '<tr><td colspan="16" class="muted">暂无数据</td></tr>';
    return;
  }
  body.innerHTML = videos.map((v, idx) => {
    const hashtags = (v.hashtags || []).map(h => `<span class="hashtag-chip">#${esc(h)}</span>`).join('');
    const sparkCell = v.spark_code
      ? `<span class="spark-code" title="${esc(v.spark_code)}">${esc(v.spark_code).slice(0, 12)}...</span><div class="muted" style="font-size:10.5px;margin-top:3px;">至 ${esc(fmt(v.spark_code_end_time))}</div>`
      : `<button class="btn btn-ghost btn-sm" onclick="generateSparkCode('${esc(v.business_id)}', '${esc(v.item_id)}', this)">⚡ 生成</button>`;
    const caption = fmt(v.caption);
    return `
      <tr>
        <td>${offset + idx + 1}</td>
        <td><input class="tag-input" value="${fmt(v.task_no) === '-' ? '' : esc(v.task_no)}" placeholder="-" onchange="saveTags('${esc(v.business_id)}', '${esc(v.item_id)}', this, null)"></td>
        <td>${v.share_url ? `<a class="link" href="${esc(v.share_url)}" target="_blank">链接 ↗</a>` : '<span class="muted">-</span>'}</td>
        <td>${esc(fmt(v.account_alias || v.account_name || v.display_name))}</td>
        <td>${v.region ? `<span class="badge badge-region">${esc(v.region)}</span>` : '<span class="muted">-</span>'}</td>
        <td>${accountTypeBadge(v.account_type)}</td>
        <td><input class="tag-input" value="${fmt(v.kol_campaign) === '-' ? '' : esc(v.kol_campaign)}" placeholder="-" onchange="saveTags('${esc(v.business_id)}', '${esc(v.item_id)}', null, this)"></td>
        <td>${esc(fmt(v.create_time))}</td>
        <td class="caption-cell" title="${esc(caption)}">${esc(caption)}</td>
        <td><div class="hashtags">${hashtags || '<span class="muted">-</span>'}</div></td>
        <td>${sparkCell}</td>
        <td>${esc(fmt(v.business_id))}</td>
        <td>${esc(fmt(v.item_id))}</td>
        <td>${fmt(v.video_views)}</td>
        <td>${fmt(v.next_day_views)}</td>
        <td>${pct(v.engagement_rate)}</td>
      </tr>
    `;
  }).join('');
}

async function saveTags(businessId, itemId, taskInput, kolInput) {
  const video = videos.find(v => v.business_id === businessId && v.item_id === itemId);
  const taskNo = taskInput ? taskInput.value.trim() : (video ? video.task_no : '');
  const kolCampaign = kolInput ? kolInput.value.trim() : (video ? video.kol_campaign : '');
  try {
    await fetchJson(`/api/tiktok-official/matrix-videos/${encodeURIComponent(businessId)}/${encodeURIComponent(itemId)}/tags`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_no: taskNo, kol_campaign: kolCampaign }),
    });
    if (video) {
      video.task_no = taskNo;
      video.kol_campaign = kolCampaign;
    }
  } catch (e) {
    alert('保存失败：' + String(e.message || e));
  }
}
window.saveTags = saveTags;

async function generateSparkCode(businessId, itemId, btn) {
  if (!confirm('生成 Spark 授权码会真实修改该视频在 TikTok 上的广告授权状态，确认继续？')) return;
  const original = btn.textContent;
  btn.textContent = '生成中...';
  btn.disabled = true;
  try {
    await fetchJson(`/api/tiktok-official/matrix-videos/${encodeURIComponent(businessId)}/${encodeURIComponent(itemId)}/spark-code`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorization_days: 30 }),
    });
    await loadVideos();
  } catch (e) {
    alert('生成失败：' + String(e.message || e));
    btn.textContent = original;
    btn.disabled = false;
  }
}
window.generateSparkCode = generateSparkCode;

function downloadExport() {
  window.open('/api/tiktok-official/matrix-export', '_blank');
}

(async function init() {
  await loadAccountsForRegions();
  await loadVideos();
})();
</script>
</body>
</html>
