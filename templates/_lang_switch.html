<!-- 全站语言切换：基于 Google 网站翻译组件，自定义按钮触发，隐藏默认 UI -->
<div id="google_translate_element" style="display:none;"></div>
<button id="lang-switch-btn" class="lang-switch-btn" onclick="toggleSiteLanguage()" title="Switch language / 切换语言">EN</button>
<style>
  .goog-te-banner-frame.skiptranslate { display: none !important; }
  body { top: 0px !important; }
  .goog-te-gadget-icon { display: none !important; }
  #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
  .goog-text-highlight { background: none !important; box-shadow: none !important; }
  .lang-switch-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 99999;
    background: #111827;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
</style>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'zh-CN',
      includedLanguages: 'en,zh-CN',
      autoDisplay: false
    }, 'google_translate_element');
  }

  function getSiteLangCookie(name) {
    const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
    return m ? decodeURIComponent(m[1]) : null;
  }

  function setSiteLangCookie(name, value) {
    document.cookie = name + '=' + value + '; path=/';
    document.cookie = name + '=' + value + '; path=/; domain=' + window.location.hostname;
  }

  function deleteSiteLangCookie(name) {
    const expire = '; expires=Thu, 01 Jan 1970 00:00:00 UTC';
    document.cookie = name + '=' + expire + '; path=/';
    document.cookie = name + '=' + expire + '; path=/; domain=' + window.location.hostname;
  }

  function toggleSiteLanguage() {
    const current = getSiteLangCookie('googtrans');
    if (current && current.indexOf('/en') !== -1) {
      deleteSiteLangCookie('googtrans');
    } else {
      setSiteLangCookie('googtrans', '/zh-CN/en');
    }
    window.location.reload();
  }

  (function () {
    const current = getSiteLangCookie('googtrans');
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('lang-switch-btn');
      if (btn) btn.textContent = (current && current.indexOf('/en') !== -1) ? '中文' : 'EN';
    });
  })();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
