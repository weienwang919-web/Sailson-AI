<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok 官号监控</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #1a1a2e; }
    .page-header { background: linear-gradient(135deg, #111827, #0f172a); color: #fff; padding: 22px 28px; }
    .page-header h1 { font-size: 20px; font-weight: 700; }
    .page-header .subtitle { font-size: 12px; color: rgba(255,255,255,0.68); margin-top: 6px; line-height: 1.6; }
    .page-header a { color: #8ec5ff; font-size: 13px; }
    .container { max-width: 1240px; margin: 0 auto; padding: 20px 18px 48px; }
    .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; border-left: 4px solid #111827; padding-left: 10px; }
    .hint { font-size: 12px; color: #666; line-height: 1.55; margin-bottom: 12px; background: #f8f9fa; padding: 10px 12px; border-radius: 8px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input, select { padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; min-width: 140px; }
    input[type="checkbox"] { min-width: auto; padding: 0; }
    .btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #111827; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #111827; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 12px; color: #666; min-height: 18px; word-break: break-all; }
    .status.err { color: #c0392b; }
    .status.ok { color: #2d7a2d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .account { border: 1px solid #eef0f3; border-radius: 12px; padding: 12px; background: #fbfbfc; }
    .account-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
    .metric-line { color: #555; font-size: 12px; line-height: 1.8; }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11px; background: #e5e7eb; color: #374151; }
    .pill-ok { background: #dcfce7; color: #166534; }
    .pill-pending { background: #fef3c7; color: #92400e; }
    .copy-btn { border: none; background: #eef2ff; color: #3730a3; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    .copy-btn:hover { background: #e0e7ff; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #eee; padding: 8px 6px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 1; }
    .table-wrap { overflow: auto; max-height: 540px; border: 1px solid #eee; border-radius: 10px; }
    .muted { color: #777; }
    .link { color: #1a7fd4; text-decoration: none; }
    .detail { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #0f172a; color: #dbeafe; border-radius: 10px; padding: 12px; max-height: 360px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
<div class="page-header">
  <h1>TikTok 官号监控</h1>
  <div class="subtitle">通过 TikTok Business API 拉取已授权官号的视频表现、主页趋势和粉丝画像。洞察字段通常有 T+24-48 小时延迟。</div>
  <div style="margin-top:10px;"><a href="/">← 返回首页</a></div>
</div>

<div class="container">
  <div class="card">
    <h2>刷新与导出</h2>
    <div class="toolbar">
      <div>
        <label>账号</label>
        <select id="account-select"><option value="">全部账号</option></select>
      </div>
      <div>
        <label>主页趋势天数</label>
        <input id="profile-days" type="number" min="1" max="60" value="30">
      </div>
      <div>
        <label>视频页数（每页最多20）</label>
        <input id="max-pages" type="number" min="1" max="50" value="5">
      </div>
      <button class="btn btn-primary" id="refresh-btn" onclick="refreshOfficial()">刷新官方数据</button>
      <button class="btn btn-secondary" onclick="openBusinessAuth()">广告主授权</button>
      <button class="btn btn-secondary" onclick="exportOfficial()">导出所选视频</button>
      <button class="btn btn-secondary" onclick="loadAll()">重新加载</button>
    </div>
    <div class="status" id="refresh-status"></div>
  </div>

  <div class="card">
    <h2>账号矩阵授权</h2>
    <div class="toolbar">
      <div>
        <label>账号别名</label>
        <input id="invite-alias" type="text" placeholder="例如 TH-Brand-01" style="min-width:220px;">
      </div>
      <div>
        <label>有效期</label>
        <select id="invite-ttl">
          <option value="3600">1 小时</option>
          <option value="86400" selected>24 小时</option>
          <option value="259200">3 天</option>
          <option value="604800">7 天</option>
          <option value="never">永不过期</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="generateInviteLink()">生成授权邀请链接</button>
    </div>
    <div class="status" id="invite-status"></div>
    <textarea id="invite-link" readonly style="display:none;width:100%;margin-top:8px;height:60px;font-size:12px;"></textarea>
    <div style="margin-top:14px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;">邀请记录</div>
      <div class="table-wrap" style="max-height:220px;">
        <table>
          <thead>
            <tr><th>别名</th><th>状态</th><th>创建时间</th><th>过期时间</th><th>授权人</th><th>链接</th></tr>
          </thead>
          <tbody id="invites-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>官号总览<span id="accounts-count" style="font-weight:400;font-size:12px;color:#666;"></span></h2>
    <div class="grid" id="accounts"></div>
  </div>

  <div class="card">
    <h2>主页每日趋势</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日期</th><th>账号</th><th>粉丝数</th><th>播放</th><th>触达</th><th>主页访问</th><th>点赞</th><th>评论</th><th>分享</th><th>新增粉</th><th>掉粉</th>
          </tr>
        </thead>
        <tbody id="metrics-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>视频明细</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="select-current-videos" onchange="toggleCurrentPageVideos(this.checked)"></th><th>发布时间</th><th>账号</th><th>视频</th><th>播放</th><th>覆盖</th><th>点赞</th><th>评论</th><th>分享</th><th>收藏</th><th>平均观看</th><th>视频时长</th><th>完播率</th><th>新增粉</th><th>详情</th>
          </tr>
        </thead>
        <tbody id="videos-body"></tbody>
      </table>
    </div>
    <div class="status" id="videos-status"></div>
  </div>

  <div class="card" id="detail-card" style="display:none;">
    <h2>视频详情原始分布</h2>
    <div class="detail" id="detail-json"></div>
  </div>
</div>

<script>
let accounts = [];
let currentTask = null;
let authUrls = null;
let currentVideoRows = [];
const selectedExportVideos = new Map();

function fmt(v) {
  if (v === null || v === undefined || v === '') return '-';
  if (typeof v === 'number') return v.toLocaleString();
  return String(v);
}

function pct(v) {
  if (v === null || v === undefined || v === '') return '-';
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return (n * 100).toFixed(2) + '%';
}

function videoKey(row) {
  return String(row.business_id || '') + '::' + String(row.item_id || '');
}

function updateSelectedCount() {
  const st = document.getElementById('videos-status');
  const total = st.dataset.total || '0';
  const shown = st.dataset.shown || '0';
  st.textContent = '共 ' + fmt(total) + ' 条视频，当前显示前 ' + shown + ' 条，已选择 ' + selectedExportVideos.size + ' 条导出';
  const selectAll = document.getElementById('select-current-videos');
  if (selectAll) {
    selectAll.checked = currentVideoRows.length > 0 && currentVideoRows.every(r => selectedExportVideos.has(videoKey(r)));
  }
}

function toggleVideoSelection(key, checked) {
  const row = currentVideoRows.find(r => videoKey(r) === key);
  if (!row) return;
  if (checked) {
    selectedExportVideos.set(key, { item_id: row.item_id, business_id: row.business_id });
  } else {
    selectedExportVideos.delete(key);
  }
  updateSelectedCount();
}

function toggleCurrentPageVideos(checked) {
  currentVideoRows.forEach(row => {
    const key = videoKey(row);
    if (checked) {
      selectedExportVideos.set(key, { item_id: row.item_id, business_id: row.business_id });
    } else {
      selectedExportVideos.delete(key);
    }
  });
  document.querySelectorAll('.video-export-check').forEach(cb => { cb.checked = checked; });
  updateSelectedCount();
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.status === 'error') throw new Error(data.message || ('HTTP ' + res.status));
  return data;
}

async function loadAccounts() {
  const data = await fetchJson('/api/tiktok-official/accounts');
  accounts = data.accounts || [];
  const sel = document.getElementById('account-select');
  sel.innerHTML = '<option value="">全部账号</option>' + accounts.map(a => (
    '<option value="' + a.business_id + '">' + (a.display_name || a.account_name || a.business_id) + '</option>'
  )).join('');
  const wrap = document.getElementById('accounts');
  if (!accounts.length) {
    wrap.innerHTML = '<div class="hint">暂无账号配置。请配置 TIKTOK_OFFICIAL_ACCOUNTS_JSON。</div>';
    return;
  }
  const regionOptions = ['TH', 'MM', 'PH', 'ID', 'MY', '其他'];
  const typeOptions = ['KOL', 'Campaign'];
  wrap.innerHTML = accounts.map(a => {
    const safeId = a.business_id.replace(/[^a-zA-Z0-9_-]/g, '_');
    const regionValue = a.region || '';
    const regionSelectOptions = ['<option value="">未设置</option>']
      .concat(regionOptions.map(r => `<option value="${r}" ${r === regionValue ? 'selected' : ''}>${r}</option>`));
    if (regionValue && !regionOptions.includes(regionValue)) {
      regionSelectOptions.push(`<option value="${fmt(regionValue)}" selected>${fmt(regionValue)}（自定义）</option>`);
    }
    const typeSelectOptions = ['<option value="">未设置</option>']
      .concat(typeOptions.map(t => `<option value="${t}" ${t === a.account_type ? 'selected' : ''}>${t}</option>`));
    return `
    <div class="account">
      <div class="account-title">
        <span>${fmt(a.display_name || a.account_name || a.username || a.business_id)}</span>
        <span class="pill">${a.enabled ? '启用' : '停用'}</span>
      </div>
      <div class="metric-line">别名：${fmt(a.account_alias)} ｜ 代运营：${fmt(a.authorized_by)}</div>
      <div class="metric-line">状态：<span class="pill">${accountHealth(a)}</span></div>
      <div class="metric-line">用户名：${fmt(a.username)}</div>
      <div class="metric-line">粉丝：${fmt(a.followers_count)} ｜ 总赞：${fmt(a.total_likes)} ｜ 视频：${fmt(a.videos_count)}</div>
      <div class="metric-line">企业号：${a.is_business_account === true ? '是' : a.is_business_account === false ? '否' : '-' } ｜ 认证：${a.is_verified === true ? '是' : a.is_verified === false ? '否' : '-'}</div>
      <div class="metric-line">最近刷新：${fmt(a.last_refreshed_at)}</div>
      ${a.profile_deep_link ? `<a class="link" href="${a.profile_deep_link}" target="_blank">打开主页</a>` : ''}
      <div class="metric-line" style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <label>国家：<select id="region-${safeId}">${regionSelectOptions.join('')}</select></label>
        <label>类型：<select id="type-${safeId}">${typeSelectOptions.join('')}</select></label>
        <button class="copy-btn" onclick="saveAccountMeta('${a.business_id}', 'region-${safeId}', 'type-${safeId}', this)">保存</button>
      </div>
    </div>
  `;
  }).join('');
  document.getElementById('accounts-count').textContent = `（共 ${accounts.length} 个账号）`;
}

async function saveAccountMeta(businessId, regionSelId, typeSelId, btn) {
  const regionSel = document.getElementById(regionSelId);
  const typeSel = document.getElementById(typeSelId);
  let region = regionSel.value;
  if (region === '其他') {
    region = (window.prompt('请输入国家/地区代码', '') || '').trim();
    if (!region) return;
  }
  const accountType = typeSel.value;
  const original = btn.textContent;
  btn.textContent = '保存中...';
  btn.disabled = true;
  try {
    await fetchJson(`/api/tiktok-official/accounts/${encodeURIComponent(businessId)}/meta`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ region, account_type: accountType }),
    });
    await loadAccounts();
  } catch (e) {
    alert('保存失败：' + String(e.message || e));
    btn.textContent = original;
    btn.disabled = false;
  }
}
window.saveAccountMeta = saveAccountMeta;

function inviteStatusInfo(inv) {
  return inv.used_at
    ? { label: '已授权', cls: 'pill-ok' }
    : { label: '未授权', cls: 'pill-pending' };
}

async function copyInviteLink(url, btn) {
  try {
    await navigator.clipboard.writeText(url);
    const original = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = original; }, 1500);
  } catch (e) {
    alert('复制失败，请手动复制：' + url);
  }
}

window.copyInviteLink = copyInviteLink;
window._inviteUrls = {};

async function loadInvites() {
  const body = document.getElementById('invites-body');
  try {
    const data = await fetchJson('/api/tiktok-official/invites');
    const rows = data.invites || [];
    window._inviteUrls = {};
    body.innerHTML = rows.map((inv, idx) => {
      const status = inviteStatusInfo(inv);
      let linkCell = '<span class="muted">-</span>';
      if (inv.url) {
        window._inviteUrls[idx] = inv.url;
        linkCell = `<button class="copy-btn" onclick="copyInviteLink(window._inviteUrls[${idx}], this)">📋 复制链接</button>`;
      }
      return `
      <tr>
        <td>${fmt(inv.account_alias)}</td>
        <td><span class="pill ${status.cls}">${status.label}</span></td>
        <td>${fmt(inv.created_at)}</td>
        <td>${inv.expires_at ? fmt(inv.expires_at) : '永不过期'}</td>
        <td>${fmt(inv.authorized_by)}</td>
        <td>${linkCell}</td>
      </tr>
    `;
    }).join('') || '<tr><td colspan="6" class="muted">暂无邀请记录</td></tr>';
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="muted">加载失败：${String(e.message || e)}</td></tr>`;
  }
}

function parseUtcTimestamp(s) {
  // 后端存的是 naive UTC（datetime.utcnow()），isoformat() 序列化后不带时区后缀；
  // 浏览器 Date 解析不带时区的 ISO 字符串会当成本地时间（UTC+8），导致过期时间算早了 8 小时。
  if (!s) return NaN;
  const hasTz = /Z$|[+-]\d{2}:?\d{2}$/.test(s);
  return new Date(hasTz ? s : s + 'Z').getTime();
}

function accountHealth(a) {
  if (!a.token_expires_at) return '需要授权';
  if (a.status && a.status !== 'active') return '已停用';
  const expiresAt = parseUtcTimestamp(a.token_expires_at);
  if (Number.isNaN(expiresAt)) return '正常';
  const hoursLeft = (expiresAt - Date.now()) / 3600000;
  if (hoursLeft <= 0) return '已过期，需要重新授权';
  if (hoursLeft <= 2) return 'token 即将过期';
  return '正常';
}

async function loadAuthUrls() {
  try {
    authUrls = await fetchJson('/api/tiktok-official/auth-urls');
  } catch (e) {
    authUrls = null;
    const st = document.getElementById('refresh-status');
    st.textContent = '授权入口暂不可用：' + String(e.message || e);
    st.className = 'status err';
  }
}

async function generateInviteLink() {
  const alias = document.getElementById('invite-alias').value.trim();
  const ttlChoice = document.getElementById('invite-ttl').value;
  const st = document.getElementById('invite-status');
  const linkBox = document.getElementById('invite-link');
  if (!alias) {
    st.textContent = '请先填写账号别名';
    st.className = 'status err';
    return;
  }
  st.textContent = '生成中...';
  st.className = 'status';
  linkBox.style.display = 'none';
  try {
    const payload = { account_alias: alias };
    if (ttlChoice === 'never') {
      payload.never_expire = true;
    } else {
      payload.ttl_seconds = Number(ttlChoice);
    }
    const data = await fetchJson('/api/tiktok-official/invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    linkBox.value = data.url;
    linkBox.style.display = 'block';
    linkBox.select();
    const expiryText = data.expires_at ? ('有效期至 ' + new Date(data.expires_at).toLocaleString()) : '永不过期';
    st.textContent = '已生成（' + expiryText + '，仅可使用一次）。复制下面的链接发给代运营人员：';
    st.className = 'status ok';
    await loadInvites();
  } catch (e) {
    st.textContent = '生成失败：' + String(e.message || e);
    st.className = 'status err';
  }
}

async function openBusinessAuth() {
  if (!authUrls) await loadAuthUrls();
  if (authUrls && authUrls.business_url) {
    window.open(authUrls.business_url, '_blank', 'noopener,noreferrer');
  }
}

async function loadMetrics() {
  const bid = document.getElementById('account-select').value;
  const days = document.getElementById('profile-days').value || 30;
  const qs = new URLSearchParams({ days });
  if (bid) qs.set('business_id', bid);
  const data = await fetchJson('/api/tiktok-official/profile-metrics?' + qs.toString());
  const rows = data.items || [];
  document.getElementById('metrics-body').innerHTML = rows.map(r => `
    <tr>
      <td>${fmt(r.metric_date)}</td><td>${fmt(r.business_id)}</td><td>${fmt(r.followers_count)}</td><td>${fmt(r.video_views)}</td>
      <td>${fmt(r.unique_video_views)}</td><td>${fmt(r.profile_views)}</td><td>${fmt(r.likes)}</td><td>${fmt(r.comments)}</td>
      <td>${fmt(r.shares)}</td><td>${fmt(r.daily_new_followers)}</td><td>${fmt(r.daily_lost_followers)}</td>
    </tr>
  `).join('') || '<tr><td colspan="11" class="muted">暂无趋势数据</td></tr>';
}

async function loadVideos() {
  const bid = document.getElementById('account-select').value;
  const qs = new URLSearchParams({ page: '1', page_size: '100' });
  if (bid) qs.set('business_id', bid);
  const data = await fetchJson('/api/tiktok-official/videos?' + qs.toString());
  const rows = data.items || [];
  currentVideoRows = rows;
  const status = document.getElementById('videos-status');
  status.dataset.total = data.total || 0;
  status.dataset.shown = rows.length;
  document.getElementById('videos-body').innerHTML = rows.map(r => `
    <tr>
      <td><input class="video-export-check" type="checkbox" ${selectedExportVideos.has(videoKey(r)) ? 'checked' : ''} onchange="toggleVideoSelection('${videoKey(r)}', this.checked)"></td>
      <td>${fmt(r.create_time)}</td>
      <td>${fmt(r.display_name || r.account_name || r.username || r.business_id)}</td>
      <td style="max-width:320px;">
        <div>${fmt(r.caption).slice(0, 90)}</div>
        ${r.share_url ? `<a class="link" href="${r.share_url}" target="_blank">打开视频</a>` : ''}
      </td>
      <td>${fmt(r.video_views)}</td><td>${fmt(r.reach)}</td><td>${fmt(r.likes)}</td><td>${fmt(r.comments)}</td>
      <td>${fmt(r.shares)}</td><td>${fmt(r.favorites)}</td><td>${fmt(r.average_time_watched)}</td><td>${fmt(r.video_duration)}</td>
      <td>${pct(r.full_video_watched_rate)}</td><td>${fmt(r.new_followers)}</td>
      <td><button class="btn btn-secondary" onclick="showDetail('${r.item_id}', '${r.business_id}')">详情</button></td>
    </tr>
  `).join('') || '<tr><td colspan="15" class="muted">暂无视频数据</td></tr>';
  updateSelectedCount();
}

async function loadAll() {
  const st = document.getElementById('refresh-status');
  st.className = 'status';
  st.textContent = '加载中...';
  try {
    await loadAuthUrls();
    await loadAccounts();
    await loadInvites();
    await loadMetrics();
    await loadVideos();
    st.textContent = '已加载';
    st.className = 'status ok';
  } catch (e) {
    st.textContent = String(e.message || e);
    st.className = 'status err';
  }
}

async function refreshOfficial() {
  const btn = document.getElementById('refresh-btn');
  const st = document.getElementById('refresh-status');
  const bid = document.getElementById('account-select').value;
  btn.disabled = true;
  st.className = 'status';
  st.textContent = '提交刷新任务...';
  try {
    const payload = {
      business_ids: bid ? [bid] : [],
      profile_days: Number(document.getElementById('profile-days').value || 30),
      max_pages: Number(document.getElementById('max-pages').value || 5),
    };
    const data = await fetchJson('/api/tiktok-official/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    currentTask = data.task_id;
    pollRefresh(currentTask);
  } catch (e) {
    st.textContent = String(e.message || e);
    st.className = 'status err';
    btn.disabled = false;
  }
}

function pollRefresh(taskId) {
  const btn = document.getElementById('refresh-btn');
  const st = document.getElementById('refresh-status');
  let n = 0;
  const timer = setInterval(async () => {
    n++;
    try {
      const data = await fetchJson('/api/tiktok-official/refresh-status/' + encodeURIComponent(taskId));
      st.textContent = data.progress || data.status || '';
      if (data.status === 'completed') {
        clearInterval(timer);
        st.textContent = '刷新完成';
        st.className = 'status ok';
        btn.disabled = false;
        await loadAll();
      } else if (data.status === 'failed') {
        clearInterval(timer);
        st.textContent = data.error || '刷新失败';
        st.className = 'status err';
        btn.disabled = false;
      } else if (n > 1200) {
        clearInterval(timer);
        st.textContent = '轮询超时，请稍后刷新页面查看';
        btn.disabled = false;
      }
    } catch (e) {
      st.textContent = String(e.message || e);
    }
  }, 2000);
}

async function showDetail(itemId, businessId) {
  try {
    const qs = new URLSearchParams({ business_id: businessId });
    const data = await fetchJson('/api/tiktok-official/videos/' + encodeURIComponent(itemId) + '?' + qs.toString());
    document.getElementById('detail-card').style.display = '';
    document.getElementById('detail-json').textContent = JSON.stringify({
      engagement_likes: data.video.engagement_likes,
      video_view_retention: data.video.video_view_retention,
      impression_sources: data.video.impression_sources,
      audience_countries: data.video.audience_countries,
      audience_genders: data.video.audience_genders,
      audience_types: data.video.audience_types,
      request_id: data.video.request_id,
      log_id: data.video.log_id,
    }, null, 2);
    document.getElementById('detail-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    alert(String(e.message || e));
  }
}

async function exportOfficial() {
  try {
    const videos = Array.from(selectedExportVideos.values());
    if (!videos.length) {
      alert('请先勾选要导出的视频');
      return;
    }
    const res = await fetch('/api/tiktok-official/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videos }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.message || ('HTTP ' + res.status));
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tiktok_official_monitor.xlsx';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    alert(String(e.message || e));
  }
}

document.getElementById('account-select').addEventListener('change', () => {
  loadMetrics();
  loadVideos();
});

loadAll();
</script>
