services:
  # ---- Web 前端 ----
  - type: web
    name: flaskproject
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start_render.sh"
    envVars:
      - key: PORT
        value: "5000"
      - key: USE_DB_WORKER
        value: "true"
      - key: PROFILE_VIDEO_SYNC_HARD_DISABLED
        value: "true"
      - key: PROFILE_VIDEO_SYNC_ENABLED
        value: "false"
      - key: FEISHU_PROFILE_VIDEO_SYNC_ENABLED
        value: "false"
      - key: ETL_VIDEO_METRICS_PROFILE_FALLBACK_ENABLED
        value: "false"
      - key: KOL_API_BASE_URL
        value: "http://127.0.0.1:8001"
      - key: KOL_APIFY_REFRESH_ENABLED
        value: "true"
      - key: KOL_PORT
        value: "8001"
      # DashScope API Key（用于大模型和向量）
      - key: DASHSCOPE_API_KEY
        sync: false
      # Apify Token（用于爬取 TikTok 等）
      - key: APIFY_TOKEN
        sync: false
      # TikTok Business API（官号监控）
      - key: TIKTOK_APP_ID
        sync: false
      - key: TIKTOK_APP_SECRET
        sync: false
      - key: TIKTOK_BUSINESS_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_OFFICIAL_ACCOUNTS_JSON
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://sailson-ai.onrender.com"
      # PostgreSQL 数据库地址（Render 创建的数据库会自动提供 DATABASE_URL）
      - key: DATABASE_URL
        sync: false
      # SMTP 邮件配置（如不需要可留空）
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FEEDBACK_EMAIL_TO
        sync: false
      - key: FEEDBACK_EMAIL_FROM
        sync: false

  # ---- Background Worker（独立进程处理长任务）----
  - type: worker
    name: flaskproject-worker
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 worker.py"
    envVars:
      - key: USE_DB_WORKER
        value: "true"
      - key: PROFILE_VIDEO_SYNC_HARD_DISABLED
        value: "true"
      - key: PROFILE_VIDEO_SYNC_ENABLED
        value: "false"
      - key: FEISHU_PROFILE_VIDEO_SYNC_ENABLED
        value: "false"
      - key: ETL_VIDEO_METRICS_PROFILE_FALLBACK_ENABLED
        value: "false"
      - key: WORKER_POLL_INTERVAL
        value: "3"
      - key: KOL_APIFY_REFRESH_ENABLED
        value: "true"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: TIKTOK_BUSINESS_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_OFFICIAL_ACCOUNTS_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
