services:
  # ---- Web 前端 ----
  - type: web
    name: flaskproject
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app -c gunicorn_config.py"
    envVars:
      - key: PORT
        value: "5000"
      - key: USE_DB_WORKER
        value: "true"
      - key: KOL_API_BASE_URL
        value: "http://flaskproject-kol:8001"
      # DashScope API Key（用于大模型和向量）
      - key: DASHSCOPE_API_KEY
        sync: false
      # Apify Token（用于爬取 TikTok 等）
      - key: APIFY_TOKEN
        sync: false
      # PostgreSQL 数据库地址（Render 创建的数据库会自动提供 DATABASE_URL）
      - key: DATABASE_URL
        sync: false
      # SMTP 邮件配置（如不需要可留空）
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FEEDBACK_EMAIL_TO
        sync: false
      - key: FEEDBACK_EMAIL_FROM
        sync: false

  # ---- KOL 后端（Render 内网私有服务）----
  - type: pserv
    name: flaskproject-kol
    env: python
    plan: starter
    rootDir: kol_web/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8001}"
    disk:
      name: kol-data
      mountPath: /var/data/kol
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8001"
      - key: DATABASE_URL
        value: "sqlite:////var/data/kol/kol.db"
      - key: APIFY_TOKEN
        sync: false
      - key: VIDEOS_PER_PROFILE
        value: "10"

  # ---- Background Worker（独立进程处理长任务）----
  - type: worker
    name: flaskproject-worker
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 worker.py"
    envVars:
      - key: USE_DB_WORKER
        value: "true"
      - key: WORKER_POLL_INTERVAL
        value: "3"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
